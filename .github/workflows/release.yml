name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Type of release"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - prerelease
      preid:
        description: "Pre-release identifier (used only if release_type=prerelease, e.g. rc1, beta1)"
        required: false
        default: "rc1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from pyproject.toml
        id: version
        run: |
          python - << 'PY'
          import os, pathlib

          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")

          try:
              import tomllib  # Python 3.11+
          except ImportError:
              import tomli as tomllib  # fallback if ever needed

          data = tomllib.loads(text)

          version = None
          if "project" in data and "version" in data["project"]:
              version = data["project"]["version"]
          elif "tool" in data and "poetry" in data["tool"] and "version" in data["tool"]["poetry"]:
              version = data["tool"]["poetry"]["version"]

          if not version:
              raise SystemExit("No 'version' found in pyproject.toml")

          print(f"Detected version: {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={version}\n")
          PY

      - name: Compute tag and name
        id: meta
        run: |
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"
          PREID="${{ github.event.inputs.preid }}"
          VERSION="${{ steps.version.outputs.version }}"

          if [ "$RELEASE_TYPE" = "prerelease" ]; then
            TAG="v${VERSION}-${PREID}"
            NAME="Pre-release v${VERSION}-${PREID}"
            PRERELEASE="true"
          else
            TAG="v${VERSION}"
            NAME="Release v${VERSION}"
            PRERELEASE="false"
          fi

          echo "Tag: $TAG"
          echo "Name: $NAME"
          echo "Prerelease: $PRERELEASE"

          {
            echo "tag=$TAG"
            echo "name=$NAME"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag if missing
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = "${{ steps.meta.outputs.tag }}";
            const sha = context.sha;

            console.log(`Processing tag: ${tag}`);

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              console.log("Tag already exists. Skipping creation.");
            } catch (error) {
              console.log("Creating tag...");
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: sha
              });
            }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}