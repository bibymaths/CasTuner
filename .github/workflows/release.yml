name: Create Release

on:
  workflow_dispatch:      # allow manual trigger
  push:
    branches: [ main ]
    paths:
      - "pyproject.toml"
      - "*/__version__.py"
      - "VERSION"

jobs:
  create-release:
    name: Build & Release Version
    runs-on: ubuntu-latest

    steps:
      # -------------------------------
      # 1) Checkout repository
      # -------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------
      # 2) Extract version string
      # -------------------------------
      - name: Get version
        id: get_version
        run: |
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION)
          elif grep -q "version" pyproject.toml; then
            VERSION=$(grep version pyproject.toml | head -n1 | sed 's/.*= "\(.*\)".*/\1/')
          else
            echo "ERROR: No VERSION or pyproject.toml version field found."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # -------------------------------
      # 3) Create git tag (if not exists)
      # -------------------------------
      - name: Create tag
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ steps.get_version.outputs.version }}";
            const tag = `v${version}`;

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`Tag ${tag} already exists. Skipping tag creation.`);
            } catch (err) {
              core.info(`Creating tag ${tag}...`);
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
            }

      # -------------------------------
      # 4) Create GitHub Release
      # -------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: "CasTuner Python v${{ steps.get_version.outputs.version }}"
          body: |
            ## Release Notes
            
            **Version:** v${{ steps.get_version.outputs.version }}

            This release contains:
            - Updated pipeline components
            - Reproducible Snakemake workflow
            - Parameter inference improvements
            - Updated documentation and API pages

            Auto-generated by GitHub Actions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}