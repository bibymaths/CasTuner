name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pyproject.toml
        id: version
        shell: bash
        run: |
          VERSION=$(grep version pyproject.toml | head -1 | sed 's/.*"//;s/".*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag if missing
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}   # use GitHub Actions builtin token
          script: |
            const tag = "v${{ steps.version.outputs.version }}";
            const sha = context.sha;

            console.log(`Processing tag: ${tag}`);

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              console.log("Tag already exists. Skipping creation.");
            } catch (error) {
              console.log("Creating tag...");
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: sha
              });
            }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}